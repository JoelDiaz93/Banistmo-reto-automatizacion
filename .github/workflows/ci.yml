name: Banistmo R010 Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banistmo-r010-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap official Gradle Wrapper when missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: bash scripts/setup-gradle-wrapper.sh

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: P0 static quality gate
        run: ./gradlew p0StaticCheck

      - name: Execute E2E tests and aggregate Serenity report
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8
        run: ./gradlew clean test aggregate -Dheadless.mode=true --warning-mode all --stacktrace

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity/
          if-no-files-found: warn
          retention-days: 14
