webdriver {
  driver = chrome
  base.url = "https://www.banistmo.com"
  timeouts {
    implicitlywait = 0
    fluentwait = 12000
  }
  capabilities {
    "goog:chromeOptions" {
      args = [
        "--disable-notifications",
        "--disable-popup-blocking",
        "--remote-allow-origins=*"
      ]
    }
  }
}

headless.mode = false

serenity {
  project.name = "Banistmo - R010 Reto técnico de Automatización"
  take.screenshots = FOR_EACH_ACTION
  report.encoding = "UTF-8"
  console.colors = true
  restart.browser.for.each = SCENARIO
}

environments {
  default {
    webdriver.base.url = "https://www.banistmo.com"
  }
}
